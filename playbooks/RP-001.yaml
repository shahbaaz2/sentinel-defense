id: RP-001
version: "1.0"
name: Authentication Abuse Investigation / Credential Protection
description: >
  Bounded response plan for an identity showing repeated authentication failures
  (DET-001). Suspends the affected test account and preserves evidence pending
  investigation - no network or infrastructure changes.
enabled: true
allowed_asset_types: []
allowed_incident_categories:
  - credential-abuse
minimum_incident_severity:
  - medium
requires_human_approval: true
reversible: true
actions:
  - action_id: suspend_test_user
    target_source: incident_identity
  - action_id: preserve_evidence
    target_source: incident
verification:
  - user_suspended
  - evidence_snapshot_created
rollback:
  - reinstate_suspended_user
risk:
  mission_impact: low
  reversibility: high
