[project]
name = "sentinel-defense"
version = "0.1.0"
description = "Sentinel: local synthetic cyber-defense prototype (Sentinel + MissionNet + Demo Control)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running Postgres (docker-compose up), see RUNBOOK.md",
    "ai_live: requires a real local MLX model load + inference (Apple Silicon only, slow) - see RUNBOOK.md 'Local AI Analyst'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infrastructure/migrations/*/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() default-argument pattern is idiomatic, not a real bug here.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["^tests/"]
