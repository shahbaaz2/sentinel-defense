[project]
name = "sentinel-defense"
version = "0.1.0"
description = "Sentinel: local synthetic cyber-defense prototype (Sentinel + MissionNet + Demo Control)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
